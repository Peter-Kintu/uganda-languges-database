<section class="post-card" aria-label="Recommended jobs">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px;">
        <strong style="font-size:15px; color:#111827;">Jobs picked for you</strong>
        <a href="{% url 'languages:browse_job_listings' %}" style="font-size:12px; color:var(--primary); font-weight:700;">Browse jobs</a>
    </div>
    {% for job in recommended_jobs|slice:':3' %}
        <a href="{% url 'languages:job_post_detail' job.id %}" style="display:block; padding:10px 0; border-top:1px solid #e5e7eb; text-decoration:none;" data-impression-kind="job" data-impression-id="{{ job.id }}">
            <span style="display:inline-block; margin-bottom:4px; padding:3px 6px; border-radius:5px; background:#eff6ff; color:#1d4ed8; font-size:10px; font-weight:800;">Recommended job</span>
            <div style="font-size:14px; font-weight:800; color:#111827;">{{ job.post_content|truncatechars:85 }}</div>
            <div style="font-size:12px; color:#6b7280; margin-top:3px;">{{ job.recruiter_name|default:'Verified recruiter' }} · {{ job.recruiter_location|default:'Flexible location' }}</div>
        </a>
    {% endfor %}
</section>
