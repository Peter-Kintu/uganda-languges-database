<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit registration {{ booking.booking_ref }}</title>
  <style>
    body { margin: 0; background: #f2eadb; color: #1b1712; font: 15px/1.4 Arial, sans-serif; }
    main { width: min(92vw, 680px); margin: 30px auto; padding: 28px; background: #fffaf0; border: 1px solid #eadcc1; }
    h1 { margin-top: 0; font: 800 30px Georgia, serif; } .ref { color: #8f3822; font-weight: 700; }
    form { display: grid; gap: 16px; } label { display: grid; gap: 6px; font-weight: 700; } input, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cdbf9e; border-radius: 4px; font: inherit; } input[type=checkbox] { width: auto; }
    .actions { display: flex; gap: 10px; align-items: center; } button, .cancel { padding: 10px 15px; border: 0; border-radius: 4px; font-weight: 700; text-decoration: none; } button { background: #8f3822; color: #fff; cursor: pointer; } .cancel { color: #8f3822; border: 1px solid #cdbf9e; }
    .errors { color: #8f3822; } ul { margin: 0; padding-left: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Edit registration</h1>
    <p class="ref">{{ booking.booking_ref }}</p>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
      {% for field in form %}
        <label{% if field.name == 'is_verified' %} style="display:flex; gap:8px; align-items:center;"{% endif %}>
          {{ field }} {{ field.label }}
          {% if field.errors %}<span class="errors">{{ field.errors }}</span>{% endif %}
        </label>
      {% endfor %}
      <div class="actions"><button type="submit">Save changes</button><a class="cancel" href="{% url 'registration_admin' %}">Cancel</a></div>
    </form>
  </main>
</body>
</html>
