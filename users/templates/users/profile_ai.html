{% extends "base.html" %}

{% block title %}Africana AI - Career Companion{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>

<style>
    :root {
        --bg-main: #ffffff;
        --bg-sidebar: #f5f7fb;
        --accent-green: #16a34a;
        --accent-green-dark: #15803d;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --glass-border: rgba(15, 23, 42, 0.08);
        --user-bg: #d1fae5;
        --ai-bg: #e2e8f0;
        --accent-ink: #064e3b;
    }

    /* --- FORCE PARENT SANITIZATION (Bypasses base.html constraints) --- */
    html, body {
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
    }

    /* Neutralize Django base.html layout blocks completely */
    #content, .content, .container, main, section, .wrapper, .content-wrapper {
        max-width: 100% !important;
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        position: static !important;
    }

    /* --- MASTER APPLICTION BREAKPOINT ENGINE --- */
    .app-container {
        display: flex;
        position: fixed;
        /* Pull layout up cleanly to align beneath standard top-navigation elements */
        top: 56px; 
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(100% - 56px);
        width: 100vw;
        overflow: hidden;
        background-color: var(--bg-main);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        box-sizing: border-box;
        z-index: 999; /* Ensure interface draws clearly over hidden global blocks */
    }

    /* If your layout uses a secondary navbar structure height modification */
    body:not(:has(nav)):not(:has(header)) .app-container {
        top: 0 !important;
        height: 100% !important;
    }

    /* --- SIDEBAR WORKSPACE ASSEMBLY --- */
    .sidebar-history {
        width: 280px;
        height: 100%;
        background-color: var(--bg-sidebar);
        border-right: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 40;
    }

    .sidebar-header {
        padding: 1.25rem;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .new-chat-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background-color: var(--accent-green);
        color: white;
        border: none;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        font-weight: 500;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .new-chat-btn:hover {
        background-color: var(--accent-green-dark);
    }

    .history-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem;
    }

    .history-item {
        padding: 0.75rem 1rem;
        border-radius: 10px;
        color: var(--text-secondary);
        font-size: 0.875rem;
        cursor: pointer;
        margin-bottom: 0.25rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: all 0.2s ease;
    }

    .history-item:hover {
        background-color: rgba(15, 23, 42, 0.04);
        color: var(--text-primary);
    }

    .history-item.active {
        background-color: rgba(22, 163, 74, 0.1);
        color: var(--accent-green);
        font-weight: 500;
    }

    .sidebar-footer {
        padding: 1rem;
        border-top: 1px solid var(--glass-border);
    }

    .clear-history-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: transparent;
        border: 1px solid var(--glass-border);
        color: #ef4444;
        padding: 0.625rem;
        border-radius: 10px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .clear-history-btn:hover {
        background-color: rgba(239, 68, 68, 0.05);
    }

    /* --- CHAT LOG ARCHITECTURE --- */
    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-width: 0;
        position: relative;
        background-color: var(--bg-main);
    }

    .chat-top-bar {
        height: 60px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        padding: 0 1.25rem;
        gap: 1rem;
        background-color: var(--bg-main);
        flex-shrink: 0;
    }

    .chat-title-block {
        min-width: 0;
    }

    .chat-title-block strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .chat-subtitle {
        color: var(--text-secondary);
        font-size: 0.72rem;
        margin-top: 0.15rem;
    }

    .menu-toggle-btn {
        display: none;
        background: transparent;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        padding: 0.25rem;
    }

    /* Scroll Engine context layer */
    .chat-log-container {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem 1.25rem;
        background-color: var(--bg-main);
    }

    .chat-inner-stream {
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }

    .welcome-panel {
        background: linear-gradient(135deg, #ecfdf5 0%, #f8fafc 68%, #fffbeb 100%);
        border: 1px solid rgba(22, 163, 74, 0.16);
        border-radius: 18px;
        padding: 1.25rem;
    }

    .welcome-panel h1 {
        color: var(--accent-ink);
        font-size: clamp(1.35rem, 3vw, 1.9rem);
        line-height: 1.2;
        margin: 0 0 0.45rem;
    }

    .welcome-panel p {
        color: var(--text-secondary);
        line-height: 1.55;
        margin: 0;
    }

    .video-advert-workspace {
        width: min(100%, 900px);
        overflow: hidden;
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        background: #fff;
    }

    .video-advert-workspace iframe {
        display: block;
        width: 100%;
        height: min(720px, 72vh);
        min-height: 520px;
        border: 0;
        background: #fff;
    }

    .video-advert-note {
        color: var(--text-secondary);
        font-size: 0.78rem;
        line-height: 1.4;
        margin: 0;
    }

    .video-advert-fallback {
        color: var(--accent-green-dark);
        display: none;
        font-size: 0.78rem;
        margin: 0.5rem 0 0;
    }

    .video-advert-fallback.visible {
        display: block;
    }

    .profile-snapshot {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.9rem;
    }

    .profile-chip,
    .prompt-chip {
        border-radius: 999px;
        font-size: 0.75rem;
        padding: 0.42rem 0.7rem;
    }

    .profile-chip {
        background: rgba(255, 255, 255, 0.75);
        color: var(--accent-ink);
        border: 1px solid rgba(6, 78, 59, 0.12);
    }

    .prompt-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.55rem;
        margin-top: 1rem;
    }

    .prompt-chip {
        background: #ffffff;
        border: 1px solid var(--glass-border);
        color: var(--text-primary);
        cursor: pointer;
        text-align: left;
        transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .prompt-chip:hover {
        border-color: var(--accent-green);
        transform: translateY(-1px);
    }

    .focus-select {
        max-width: 145px;
        min-height: 36px;
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        background: transparent;
        color: var(--text-secondary);
        padding: 0 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
    }

    .mode-select {
        max-width: 135px;
        min-height: 36px;
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        background: #fff;
        color: var(--text-secondary);
        padding: 0 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
    }

    .message-wrapper {
        display: flex;
        width: 100%;
    }

    .message-wrapper.user {
        justify-content: flex-end;
    }

    .message-wrapper.ai {
        justify-content: flex-start;
    }

    .message-bubble {
        max-width: 78%;
        padding: 0.875rem 1.25rem;
        border-radius: 1.25rem;
        font-size: 0.95rem;
        line-height: 1.5;
        word-wrap: break-word;
    }

    .message-wrapper.user .message-bubble {
        background-color: var(--user-bg);
        color: var(--text-primary);
        border-bottom-right-radius: 4px;
    }

    .message-wrapper.ai .message-bubble {
        background-color: var(--ai-bg);
        color: var(--text-primary);
        border-bottom-left-radius: 4px;
    }

    .message-bubble p {
        margin: 0 0 0.75rem 0;
    }
    .message-bubble p:last-child {
        margin-bottom: 0;
    }

    .ai-message-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
        max-width: 78%;
    }

    .ai-message-content .message-bubble {
        max-width: 100%;
    }

    .copy-response-btn {
        align-items: center;
        background: transparent;
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        color: var(--text-secondary);
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        font-size: 0.72rem;
        gap: 0.35rem;
        padding: 0.3rem 0.5rem;
        transition: background-color 0.2s ease, color 0.2s ease;
    }

    .copy-response-btn:hover,
    .copy-response-btn.copied {
        background: rgba(22, 163, 74, 0.08);
        color: var(--accent-green-dark);
    }

    .loading-message .message-bubble {
        background-color: rgba(226, 232, 240, 0.95);
        border-color: rgba(15, 23, 42, 0.08);
        color: var(--text-primary);
        opacity: 1;
    }

    .loading-progress {
        display: grid;
        gap: 0.55rem;
        min-width: min(100%, 360px);
    }

    .loading-step {
        align-items: center;
        color: var(--text-secondary);
        display: flex;
        font-size: 0.82rem;
        gap: 0.55rem;
        line-height: 1.3;
        opacity: 0.58;
        transition: opacity 0.2s ease, color 0.2s ease;
    }

    .loading-step-marker {
        align-items: center;
        border: 1px solid currentColor;
        border-radius: 50%;
        display: inline-flex;
        flex: 0 0 17px;
        font-size: 0.65rem;
        height: 17px;
        justify-content: center;
        width: 17px;
    }

    .loading-step.active {
        color: var(--accent-green-dark);
        opacity: 1;
    }

    .loading-step.done {
        color: var(--accent-green-dark);
        opacity: 0.85;
    }

    .loading-step.active .loading-step-marker {
        animation: pulse 1.1s infinite ease-in-out;
        background: var(--accent-green);
        border-color: var(--accent-green);
        color: #fff;
    }

    .loading-delay-note {
        color: var(--text-secondary);
        display: none;
        font-size: 0.75rem;
        margin-top: 0.15rem;
    }

    .loading-delay-note.visible {
        display: block;
    }

    .loading-dots {
        display: inline-flex;
        gap: 0.35rem;
        align-items: center;
        margin-left: 0.25rem;
    }

    .loading-dot {
        width: 8px;
        height: 8px;
        background-color: var(--accent-green);
        border-radius: 50%;
        opacity: 0.35;
        animation: pulse 1s infinite ease-in-out;
    }

    .loading-dot:nth-child(2) {
        animation-delay: 0.15s;
    }

    .loading-dot:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.5); opacity: 1; }
    }

    /* --- CRITICAL BOUNDED INPUT PANEL --- */
    .chat-input-area {
        padding: 14px 16px env(safe-area-inset-bottom, 14px);
        background: var(--bg-main);
        border-top: 1px solid var(--glass-border);
        width: 100%;
        box-sizing: border-box;
        flex-shrink: 0;
    }

    .input-glass-wrapper {
        display: flex !important;
        align-items: flex-end !important;
        gap: 8px !important;
        background: var(--bg-sidebar);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 8px 14px;
        max-width: 800px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
    }

    .attachment-tools {
        max-width: 800px;
        margin: 0 auto 0.6rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        min-height: 30px;
    }

    .attachment-button,
    .analyze-attachment-button {
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        background: var(--bg-sidebar);
        color: var(--text-secondary);
        cursor: pointer;
        font: inherit;
        font-size: 0.75rem;
        padding: 0.45rem 0.7rem;
    }

    .analyze-attachment-button {
        background: var(--accent-green);
        border-color: var(--accent-green);
        color: #fff;
        display: none;
    }

    .attachment-button:hover,
    .analyze-attachment-button:hover {
        filter: brightness(0.95);
    }

    .attachment-preview {
        align-items: center;
        color: var(--text-secondary);
        display: none;
        font-size: 0.75rem;
        gap: 0.45rem;
        min-width: 0;
    }

    .attachment-preview img {
        border-radius: 6px;
        height: 30px;
        object-fit: cover;
        width: 30px;
    }

    .attachment-name {
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .attachment-status {
        color: var(--text-secondary);
        font-size: 0.75rem;
        margin-left: auto;
    }

    #chatInput {
        flex: 1 !important;
        width: auto !important;
        min-width: 0 !important;
        background: transparent !important;
        border: none !important;
        outline: none !important;
        resize: none !important;
        color: var(--text-primary) !important;
        font-size: 15px !important;
        line-height: 22px !important;
        padding: 6px 0 !important;
        font-family: inherit !important;
        max-height: 140px !important;
        box-sizing: border-box !important;
    }

    .btn-send {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
        width: 36px !important;
        height: 36px !important;
        border-radius: 50% !important;
        background-color: var(--accent-green) !important;
        color: #ffffff !important;
        border: none !important;
        cursor: pointer !important;
        padding: 0 !important;
        margin: 0 0 1px 0 !important;
        transition: background-color 0.2s ease;
    }

    .btn-send:hover {
        background-color: var(--accent-green-dark) !important;
    }

    .btn-voice {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
        width: 36px !important;
        height: 36px !important;
        border-radius: 50% !important;
        background: transparent !important;
        color: var(--text-secondary) !important;
        border: 1px solid var(--glass-border) !important;
        cursor: pointer !important;
        padding: 0 !important;
        margin: 0 0 1px 0 !important;
    }

    .btn-voice.listening {
        color: #dc2626 !important;
        border-color: #dc2626 !important;
    }

    .language-select {
        max-width: 150px;
        min-height: 36px;
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        background: transparent;
        color: var(--text-secondary);
        padding: 0 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
    }

    .sidebar-overlay {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(2px);
        z-index: 35;
    }

    /* --- SCREEN SIZE RESPONSIVE BREAKPOINTS --- */
    @media (max-width: 768px) {
        .app-container {
            top: 0 !important;
            height: 100% !important;
        }

        .menu-toggle-btn {
            display: block;
        }

        .sidebar-history {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            transform: translateX(-100%);
        }

        .sidebar-history.open {
            transform: translateX(0);
        }

        .sidebar-history.open + .sidebar-overlay {
            display: block;
        }

        .message-bubble {
            max-width: 85%;
        }

        .ai-message-content {
            max-width: 85%;
        }

        .chat-subtitle,
        .chat-top-bar > label {
            display: none;
        }

        .focus-select {
            max-width: 112px;
        }

        .mode-select {
            max-width: 105px;
        }

        .prompt-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="app-container">
    <div class="sidebar-history" id="sidebarMenu">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="createNewChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Chat
            </button>
        </div>
        <div class="history-scroll" id="historyList"></div>
        <div class="sidebar-footer">
            <button class="clear-history-btn" onclick="clearChat()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Clear Conversations
            </button>
        </div>
    </div>

    <div class="sidebar-overlay" id="menuOverlay" onclick="toggleMobileMenu()"></div>

    <div class="chat-main">
        <div class="chat-top-bar">
            <button class="menu-toggle-btn" onclick="toggleMobileMenu()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="chat-title-block" id="chatTitle">
                <strong>Africana AI</strong>
                <div class="chat-subtitle">Your local career and business companion</div>
            </div>
            <select id="focusSelect" class="focus-select" aria-label="Choose your current focus" title="Choose your current focus">
                <option value="career">Career growth</option>
                <option value="jobs">Find opportunities</option>
                <option value="business">Build a business</option>
                <option value="skills">Learn new skills</option>
            </select>
            <select id="modeSelect" class="mode-select" aria-label="Choose assistant mode" title="Choose assistant mode">
                <option value="chat">Smart chat</option>
                <option value="research">Research</option>
                <option value="plan">Build a plan</option>
                <option value="creative">Brainstorm</option>
            </select>
            <label for="chatLanguage" style="margin-left: auto; font-size: 12px; color: var(--text-secondary);">Language</label>
            <select id="chatLanguage" class="language-select" aria-label="Choose chat language" title="Choose chat language">
                <option value="auto">Auto detect</option>
                <optgroup label="Ugandan languages">
                    <option value="lg">Luganda</option><option value="nyn">Runyankole</option>
                    <option value="ach">Acholi</option><option value="lgg">Lugbara</option>
                    <option value="teo">Ateso</option><option value="xog">Lusoga</option>
                    <option value="nyo">Runyoro</option><option value="ttj">Rutooro</option>
                    <option value="alz">Alur</option><option value="cgg">Rukiga</option>
                    <option value="myx">Lumasaba</option><option value="kpz">Kupsapiiny</option>
                    <option value="pok">Pokot</option>
                </optgroup>
                <optgroup label="African languages">
                    <option value="sw">Swahili</option><option value="rw">Kinyarwanda</option>
                    <option value="am">Amharic</option><option value="ha">Hausa</option>
                    <option value="ig">Igbo</option><option value="yo">Yoruba</option>
                    <option value="zu">Zulu</option><option value="xh">Xhosa</option>
                    <option value="sn">Shona</option><option value="so">Somali</option>
                    <option value="om">Oromo</option><option value="ti">Tigrinya</option>
                    <option value="ln">Lingala</option><option value="mg">Malagasy</option>
                    <option value="st">Sesotho</option><option value="tn">Setswana</option>
                    <option value="ee">Ewe</option><option value="ak">Akan</option>
                    <option value="wo">Wolof</option><option value="ff">Fulfulde</option>
                    <option value="bm">Bambara</option><option value="ber">Tamazight</option>
                </optgroup>
                <option value="en">English</option><option value="fr">French</option><option value="pt">Portuguese</option>
            </select>
        </div>

        <div class="chat-log-container">
            <div class="chat-inner-stream" id="chatLog"></div>
        </div>

        <div class="chat-input-area">
            <div class="attachment-tools">
                <input id="attachmentInput" type="file" accept="image/*,application/pdf,text/plain,text/csv,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.pdf,.docx,.txt,.csv,.json" hidden>
                <button type="button" class="attachment-button" id="attachmentButton" title="Upload a CV, document, or outfit photo">
                    <span aria-hidden="true">+</span> Add file
                </button>
                <div class="attachment-preview" id="attachmentPreview">
                    <img id="attachmentThumbnail" alt="Selected image preview">
                    <span class="attachment-name" id="attachmentName"></span>
                </div>
                <button type="button" class="analyze-attachment-button" id="analyzeAttachmentButton">Analyze file</button>
                <span class="attachment-status" id="attachmentStatus" aria-live="polite"></span>
            </div>
            <div class="input-glass-wrapper">
                <textarea id="chatInput" placeholder="Message your career AI..." rows="1"></textarea>
                <button type="button" onclick="toggleVoiceInput()" id="voiceInputButton" class="btn-voice" title="Speak your message" aria-label="Speak your message">

                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="M19 9a5 5 0 0 1 0 6M22 6a9 9 0 0 1 0 12"></path></svg>

                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">

<script>
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const sidebarMenu = document.getElementById('sidebarMenu');
    const overlay = document.getElementById('menuOverlay');
    const chatLanguage = document.getElementById('chatLanguage');
    const focusSelect = document.getElementById('focusSelect');
    const modeSelect = document.getElementById('modeSelect');
    const attachmentInput = document.getElementById('attachmentInput');
    const attachmentButton = document.getElementById('attachmentButton');
    const attachmentPreview = document.getElementById('attachmentPreview');
    const attachmentThumbnail = document.getElementById('attachmentThumbnail');
    const attachmentName = document.getElementById('attachmentName');
    const analyzeAttachmentButton = document.getElementById('analyzeAttachmentButton');
    const attachmentStatus = document.getElementById('attachmentStatus');
    const profileContext = {
        name: "{{ user.get_full_name|default:user.username|escapejs }}",
        headline: "{{ user.headline|default:''|escapejs }}",
        location: "{{ user.location|default:''|escapejs }}"
    };

    let currentSessionId = '';
    let lastAiReply = '';
    let speechRecognition = null;
    let requestInFlight = false;
    let loadingTimers = [];
    let selectedChatLanguage = localStorage.getItem('africana_chat_language') || 'auto';
    let selectedFocus = localStorage.getItem('africana_ai_focus') || 'career';
    let selectedMode = localStorage.getItem('africana_ai_mode') || 'chat';
    chatLanguage.value = selectedChatLanguage;
    focusSelect.value = selectedFocus;
    modeSelect.value = selectedMode;
    chatLanguage.addEventListener('change', function() {
        selectedChatLanguage = chatLanguage.value;
        localStorage.setItem('africana_chat_language', selectedChatLanguage);
    });
    focusSelect.addEventListener('change', function() {
        selectedFocus = focusSelect.value;
        localStorage.setItem('africana_ai_focus', selectedFocus);
    });
    modeSelect.addEventListener('change', function() {
        selectedMode = modeSelect.value;
        localStorage.setItem('africana_ai_mode', selectedMode);
    });
    attachmentButton.addEventListener('click', () => attachmentInput.click());
    attachmentInput.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        attachmentName.textContent = file.name;
        attachmentPreview.style.display = 'flex';
        analyzeAttachmentButton.style.display = 'inline-block';
        attachmentStatus.textContent = `${Math.round(file.size / 1024)} KB selected`;
        if (file.type.startsWith('image/')) {
            attachmentThumbnail.src = URL.createObjectURL(file);
            attachmentThumbnail.style.display = 'block';
        } else {
            attachmentThumbnail.removeAttribute('src');
            attachmentThumbnail.style.display = 'none';
        }
    });

    analyzeAttachmentButton.addEventListener('click', async function() {
        const file = attachmentInput.files[0];
        if (!file || !currentSessionId) return;
        const formData = new FormData();
        formData.append('attachment', file);
        formData.append('user_focus', selectedFocus);
        formData.append('language', selectedChatLanguage === 'auto' ? detectLanguage(chatInput.value) : selectedChatLanguage);
        formData.append('user_need', chatInput.value.trim());
        this.disabled = true;
        attachmentStatus.textContent = 'Analyzing...';
        try {
            const response = await fetchWithRecovery('/api/v1/analyze_ai_attachment/', {
                method: 'POST',
                headers: {'X-CSRFToken': getCookie('csrftoken')},
                body: formData
            }, 2);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Analysis failed.');
            appendMessage('user', `Analyze ${file.name}${chatInput.value.trim() ? `: ${chatInput.value.trim()}` : ''}`);
            saveMessage(currentSessionId, 'user', `Analyze ${file.name}`);
            const safeAnalysisReply = sanitizeAssistantReply(data.text || '');
            appendAssistantReply(safeAnalysisReply || 'I reviewed the file and can help you turn it into a focused action plan. Share the specific goal or role you want to target next.');
            saveMessage(currentSessionId, 'ai', safeAnalysisReply || 'I reviewed the file and can help you turn it into a focused action plan. Share the specific goal or role you want to target next.');
            chatInput.value = '';
            attachmentInput.value = '';
            attachmentPreview.style.display = 'none';
            analyzeAttachmentButton.style.display = 'none';
            attachmentStatus.textContent = 'Analysis complete';
            updateHistorySidebar();
        } catch (error) {
            attachmentStatus.textContent = error.message;
        } finally {
            this.disabled = false;
        }
    });
    const speechLanguageMap = {
        lg: 'lg-UG', lug: 'lg-UG', sw: 'sw-KE', swa: 'sw-KE',
        rw: 'rw-RW', kin: 'rw-RW', am: 'am-ET', ha: 'ha-NG',
        nyn: 'en-UG', ach: 'en-UG', lgg: 'en-UG', teo: 'en-UG', xog: 'en-UG',
        nyo: 'en-UG', ttj: 'en-UG', alz: 'en-UG', cgg: 'en-UG', myx: 'en-UG',
        yo: 'yo-NG', ig: 'ig-NG', zu: 'zu-ZA', xh: 'xh-ZA',
        sn: 'sn-ZW', so: 'so-SO', om: 'om-ET', ti: 'ti-ET', ln: 'fr-CD',
        mg: 'fr-MG', st: 'st-ZA', tn: 'tn-ZA', ee: 'ee-GH', ak: 'ak-GH',
        wo: 'fr-SN', ff: 'fr-SN', bm: 'fr-ML', ber: 'fr-MA',
        en: 'en-US'
    };

    function selectedSpeechLanguage(language) {
        return speechLanguageMap[language] || language || 'en-US';
    }

    function toggleVoiceInput() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const button = document.getElementById('voiceInputButton');
        if (!SpeechRecognition) {
            appendMessage('ai', 'Voice input is not supported by this browser. You can still use the speaker button for replies.');
            return;
        }
        if (speechRecognition) {
            speechRecognition.stop();
            return;
        }

        speechRecognition = new SpeechRecognition();
        speechRecognition.lang = selectedSpeechLanguage(selectedChatLanguage === 'auto' ? detectLanguage(chatInput.value) : selectedChatLanguage);
        speechRecognition.continuous = false;
        speechRecognition.interimResults = false;
        button.classList.add('listening');
        speechRecognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            chatInput.value = `${chatInput.value} ${transcript}`.trim();
            chatInput.dispatchEvent(new Event('input'));
        };
        speechRecognition.onerror = function() {
            appendMessage('ai', 'Voice input could not be heard. Please try again or type your message.');
        };
        speechRecognition.onend = function() {
            button.classList.remove('listening');
            speechRecognition = null;
        };
        speechRecognition.start();
    }

    function speakText(text, language) {
        if (!text) return;
        const cleanText = text.replace(/[*_#`]/g, '').replace(/\s+/g, ' ').trim();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = selectedSpeechLanguage(language);
            window.speechSynthesis.speak(utterance);
            return;
        }
        const audio = new Audio(`/api/v1/tts/?text=${encodeURIComponent(cleanText)}&lang=${encodeURIComponent(language || 'en')}`);
        audio.play().catch(() => appendMessage('ai', 'Voice playback is not supported by this browser.'));
    }

    function speakLastReply() {
        if (lastAiReply) speakText(lastAiReply, window.lastChatLanguage || 'en');
    }
    const WELCOME_MESSAGE = "Hello! I am Africana AI, your intelligent career and business companion. I'm here to help with job strategies, career advancement, business planning, entrepreneurship, and professional development. What can I assist you with today?";

    if (window.marked) {
        const customRenderer = new marked.Renderer();
        customRenderer.table = function(header, body) {
            let resultText = '<div class="table-to-paragraph-view" style="margin: 0.5rem 0; padding: 0.25rem 0;">';
            let cleanHeaders = header.replace(/<[^>]*>/g, '|').split('|').map(s => s.trim()).filter(Boolean);
            let cleanRows = body.replace(/<\/tr>/g, '---').replace(/<[^>]*>/g, '|').split('---');

            cleanRows.forEach(row => {
                let columns = row.split('|').map(s => s.trim()).filter(Boolean);
                if (columns.length > 0) {
                    resultText += '<div style="margin-bottom: 0.75rem; background: rgba(0,0,0,0.02); padding: 8px; border-radius: 8px;">';
                    columns.forEach((col, idx) => {
                        let label = cleanHeaders[idx] ? `<strong>${cleanHeaders[idx]}:</strong> ` : '';
                        resultText += `<div style="font-size: 0.9rem; line-height: 1.4;">${label}${col}</div>`;
                    });
                    resultText += '</div>';
                }
            });
            resultText += '</div>';
            return resultText;
        };
        marked.setOptions({ renderer: customRenderer });
    }

    function toggleMobileMenu() {
        sidebarMenu.classList.toggle('open');
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function getChatSessions() {
        try {
            return JSON.parse(localStorage.getItem('chat_sessions')) || {};
        } catch(e) {
            return {};
        }
    }

    function saveMessage(sessionId, role, text) {
        const sessions = getChatSessions();
        if (!sessions[sessionId]) sessions[sessionId] = [];
        sessions[sessionId].push({ role, text, timestamp: Date.now() });
        sessions[sessionId] = sessions[sessionId].slice(-40);
        localStorage.setItem('chat_sessions', JSON.stringify(sessions));
    }

    async function fetchWithRecovery(url, options, attempts = 2) {
        let lastError;
        for (let attempt = 0; attempt < attempts; attempt += 1) {
            const controller = new AbortController();
            const timeout = window.setTimeout(() => controller.abort(), 45000);
            try {
                const response = await fetch(url, {...options, signal: controller.signal});
                if (response.ok || response.status < 500 || attempt === attempts - 1) return response;
                lastError = new Error(`Service returned ${response.status}`);
            } catch (error) {
                lastError = error.name === 'AbortError'
                    ? new Error('The request timed out. Please try again.')
                    : error;
                if (attempt === attempts - 1) throw lastError;
            } finally {
                window.clearTimeout(timeout);
            }
            await new Promise(resolve => window.setTimeout(resolve, 700 * (attempt + 1)));
        }
        throw lastError || new Error('The AI service is unavailable.');
    }

    async function runAgentCommand(text) {
        const command = text.trim();
        if (selectedMode === 'research' && !command.startsWith('/')) {
            return runAgentCommand(`/research ${command}`);
        }
        if (command.toLowerCase().startsWith('/research ')) {
            const query = command.slice(10).trim();
            const response = await fetchWithRecovery('/api/v1/agent/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({action: 'research', query})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Research failed.');
            if (!data.sources?.length) {
                return 'No sources were returned. The free search provider may be rate-limited; please try again shortly.';
            }
            const sourceText = data.sources.map((source, index) => `${index + 1}. [${source.title}](${source.url})\n${source.excerpt}`).join('\n\n');
            const contactText = (data.contact_results || []).map(result => {
                const contacts = result.contacts || {};
                const emails = (contacts.emails || []).map(email => `Email: ${email}`).join(' | ');
                const phones = (contacts.phones || []).map(phone => `Phone: ${phone}`).join(' | ');
                const links = (contacts.contact_links || []).map(link => `[Contact page](${link})`).join(' | ');
                return `- **[${result.title}](${result.url})**${emails || phones || links ? `\n  ${[emails, phones, links].filter(Boolean).join(' | ')}` : ''}`;
            }).join('\n');
            return `## Web research\n\n${sourceText}${contactText ? `\n\n## Public contacts found\n\n${contactText}` : ''}`;
        }

        if (command.toLowerCase().startsWith('/remember ')) {
            const memory = command.slice(10).split(':');
            const key = memory.shift()?.trim();
            const value = memory.join(':').trim();
            const response = await fetchWithRecovery('/api/v1/agent/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({action: 'remember', key, value})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Memory save failed.');
            return `Saved that as a durable preference: **${key}**.`;
        }

        if (command.toLowerCase().startsWith('/plan ')) {
            const parts = command.slice(6).split('|');
            const goal = parts.shift().trim();
            const steps = parts.join('|').split(';').map(step => step.trim()).filter(Boolean);
            const response = await fetchWithRecovery('/api/v1/agent/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({action: 'plan', title: goal, goal, steps, background_research: true})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Plan creation failed.');
            return `## Plan created\n\n**${data.title}**\n\n${data.steps.map((step, index) => `${index + 1}. ${step.title}`).join('\n')}\n\nCheckpoint ID: ${data.plan_id}`;
        }

        if (command.toLowerCase().startsWith('/checkpoint ')) {
            const parts = command.slice(12).split('|');
            const [planId, step] = parts.shift().trim().split(/\s+/);
            const response = await fetchWithRecovery('/api/v1/agent/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({action: 'checkpoint', plan_id: planId, step: Number(step), evidence: parts.join('|').trim()})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Checkpoint update failed.');
            return `Checkpoint saved. Next step: ${data.current_step + 1}. Plan status: **${data.status}**.`;
        }

        return null;
    }

    function getSessionHistory(sessionId) {
        return getChatSessions()[sessionId] || [];
    }

    function appendMessage(role, text) {
        text = role === 'user' ? text : sanitizeAssistantReply(text);
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role === 'user' ? 'user' : 'ai'}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        
        if (role === 'user') {
            bubble.innerText = text;
        } else {
            try {
                bubble.innerHTML = marked.parse(text);
            } catch(e) {
                bubble.innerText = text;
            }
        }
        
        if (role === 'ai') {
            const responseContent = document.createElement('div');
            responseContent.className = 'ai-message-content';
            responseContent.appendChild(bubble);

            const copyButton = document.createElement('button');
            copyButton.type = 'button';
            copyButton.className = 'copy-response-btn';
            copyButton.title = 'Copy response';
            copyButton.setAttribute('aria-label', 'Copy AI response');
            copyButton.innerHTML = `
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy</span>
            `;
            copyButton.addEventListener('click', () => copyResponse(copyButton, text));
            responseContent.appendChild(copyButton);
            wrapper.appendChild(responseContent);
        } else {
            wrapper.appendChild(bubble);
        }
        chatLog.appendChild(wrapper);
        scrollToBottom();
    }

    async function copyResponse(button, text) {
        try {
            await navigator.clipboard.writeText(text);
            button.classList.add('copied');
            button.querySelector('span').textContent = 'Copied';
            window.setTimeout(() => {
                button.classList.remove('copied');
                button.querySelector('span').textContent = 'Copy';
            }, 1600);
        } catch (error) {
            button.querySelector('span').textContent = 'Copy failed';
            window.setTimeout(() => {
                button.querySelector('span').textContent = 'Copy';
            }, 1600);
        }
    }

    function escapeHtml(value) {
        const element = document.createElement('div');
        element.innerText = value;

    }

    function extractUrlFromText(text) {
        const match = String(text || '').match(/https?:\/\/[^\s]+/i);
        return match ? match[0] : null;
    }

    function shouldUseWebResearch(text) {
        const url = extractUrlFromText(text);
        if (url) return true;
        if (selectedMode === 'research') return true;
        return /search the web|look up|research|find info|check website|analyze.*url|website|web/i.test(String(text || ''));
    }

    function isVideoAdvertRequest(text) {
        return /\b(video|reel|promo|promotional)\b/i.test(String(text || ''))
            && /\b(advert|advertisement|ad|commercial|marketing|promote|promotion|business)\b/i.test(String(text || ''));

    function detectFakeOpportunity(text) {
        const candidate = String(text || '').trim();
        if (!candidate) return null;
        const lower = candidate.toLowerCase();
        const employmentTerms = /(job|vacancy|hiring|recruiter|employment|contract|freelance|opportunity|position|business deal|partnership)/i;
        const redFlags = [
            'pay upfront', 'pay to work', 'registration fee', 'training fee', 'processing fee',
            'guaranteed income', 'guaranteed salary', 'easy money', 'work from home no skills',
            'send money first', 'wire transfer', 'bitcoin', 'crypto', 'western union', 'pay by mobile money',
            'no interview', 'urgent hiring', 'limited slots', 'immediate approval', 'cash app',
            'whatsapp only', 'telegram only', 'dm me', 'reply to this message', 'contact me privately',
            'bank account details', 'payment before interview', 'salary before interview', 'send cv to personal email'
        ];
        const flags = redFlags.filter(flag => lower.includes(flag));
        const hasEmailContact = /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i.test(candidate) && employmentTerms.test(candidate);
        if (employmentTerms.test(candidate) && (flags.length >= 1 || hasEmailContact)) {
            return {
                fake: true,
                reasons: flags.length ? flags.slice(0, 4) : ['personal email contact without official company details']
            };
        }
        return null;
    }

    function updateLoadingStage(stageIndex) {
        const steps = document.querySelectorAll('#loadingMessage .loading-step');
        steps.forEach((step, index) => {
            step.classList.toggle('active', index === stageIndex);
            step.classList.toggle('done', index < stageIndex);
            const marker = step.querySelector('.loading-step-marker');
            if (marker) marker.textContent = index < stageIndex ? '✓' : index + 1;
        });
    }

    function appendLoadingMessage(researchRequested = false) {
        removeLoadingMessage();
        const stages = [
            'Planning the best response',
            'Evaluating your goals and options',
            researchRequested ? 'Checking relevant sources' : 'Building practical recommendations',
            'Preparing clear next steps'
        ];
        const wrapper = document.createElement('div');
        wrapper.id = 'loadingMessage';
        wrapper.className = 'message-wrapper ai loading-message';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = `
            <div class="loading-progress" role="status" aria-live="polite" aria-label="Africana AI is preparing a response">
                ${stages.map((stage, index) => `
                    <div class="loading-step${index === 0 ? ' active' : ''}">
                        <span class="loading-step-marker">${index + 1}</span>
                        <span>${escapeHtml(stage)}</span>
                    </div>
                `).join('')}
                <span class="loading-delay-note" id="loadingDelayNote">Just a second, this is taking a little longer than usual. I am still working on it.</span>
            </div>
        `;

        wrapper.appendChild(bubble);
        chatLog.appendChild(wrapper);
        scrollToBottom();
        loadingTimers = [
            window.setTimeout(() => updateLoadingStage(1), 900),
            window.setTimeout(() => updateLoadingStage(2), 2200),
            window.setTimeout(() => updateLoadingStage(3), 4800),
            window.setTimeout(() => {
                const delayNote = document.getElementById('loadingDelayNote');
                if (delayNote) delayNote.classList.add('visible');
            }, 9000)
        ];
    }

    function removeLoadingMessage() {
        loadingTimers.forEach(timer => window.clearTimeout(timer));
        loadingTimers = [];
        const existing = document.getElementById('loadingMessage');
        if (existing) {
            existing.remove();
        }
    }

    function scrollToBottom() {
        const container = document.querySelector('.chat-log-container');
        if (container) {
            container.scrollTop = container.scrollHeight;
        }
    }

    // Auto-detect language from user input
    function detectLanguage(text) {
        const swahiliKeywords = ['mimi', 'unajua', 'karibu', 'shukrani', 'leo', 'nini', 'lakini', 'tunaweza'];
        const lugandaKeywords = ['nze', 'okukuba', 'omugenyi', 'webale', 'leero', 'ki', 'naye', 'tusobola'];
        const runyankoleKeywords = ['nyowe', 'ori ota', 'webare', 'nikaki', 'tukore'];
        const acholiKeywords = ['apwoyo', 'itimo', 'ngo ma', 'an'];
        const atesoKeywords = ['ejai', 'apei', 'ngai', 'ibore'];
        const lusogaKeywords = ['niina', 'weebale', 'otya', 'kiina'];
        const yorubaKeywords = ['mo', 'lo', 'se', 'e', 'nko', 'wa', 'soso'];
        
        const lowerText = text.toLowerCase();
        const swahiliScore = swahiliKeywords.filter(kw => lowerText.includes(kw)).length;
        const lugandaScore = lugandaKeywords.filter(kw => lowerText.includes(kw)).length;
        const runyankoleScore = runyankoleKeywords.filter(kw => lowerText.includes(kw)).length;
        const acholiScore = acholiKeywords.filter(kw => lowerText.includes(kw)).length;
        const atesoScore = atesoKeywords.filter(kw => lowerText.includes(kw)).length;
        const lusogaScore = lusogaKeywords.filter(kw => lowerText.includes(kw)).length;
        const yorubaScore = yorubaKeywords.filter(kw => lowerText.includes(kw)).length;

        const scores = [
            ['sw', swahiliScore], ['lg', lugandaScore], ['nyn', runyankoleScore],
            ['ach', acholiScore], ['teo', atesoScore], ['xog', lusogaScore],
            ['yo', yorubaScore]
        ].sort((left, right) => right[1] - left[1]);
        if (scores[0][1] > 0) return scores[0][0];
        return 'en';
    }

    async function tryBrowserAi(messages, language, focus) {
        const browserAi = window.LanguageModel || window.ai?.languageModel;
        if (!browserAi) return null;

        const systemPrompt = `You are Africana AI, the most capable practical career and business guide for African professionals. Respond in ${language || 'English'} with direct, high-value advice, clear next steps, and confident recommendations grounded in the user's goals. Do not mention being a Google-trained model, a generic large language model, or being "still under development." If you cannot access a live website, explain that you can still help with strategy, planning, CV review, job search, and business analysis based on the details provided. Current focus: ${focus}. Current mode: ${selectedMode}.`;
        const prompt = messages.map(message => {
            const speaker = message.role === 'assistant' ? 'Assistant' : 'User';
            return `${speaker}: ${message.text}`;
        }).join('\n\n');

        try {
            let session;
            if (window.LanguageModel) {
                const availability = await window.LanguageModel.availability();
                if (availability === 'unavailable') return null;
                session = await window.LanguageModel.create({ systemPrompt });
            } else {
                const capabilities = await browserAi.capabilities();
                if (capabilities.available === 'no') return null;
                session = await browserAi.create({ systemPrompt });
            }

            const reply = await session.prompt(prompt);
            session.destroy?.();
            return typeof reply === 'string' && reply.trim() ? reply.trim() : null;
        } catch (error) {
            console.info('Browser AI is unavailable; continuing with built-in guidance.', error);
            return null;
        }
    }

    function appendAssistantReply(text) {
        const cleanedText = sanitizeAssistantReply(text);
        lastAiReply = cleanedText;
        appendMessage('ai', cleanedText);
        saveMessage(currentSessionId, 'ai', cleanedText);
    }

    function sanitizeAssistantReply(text) {
        const value = String(text || '').trim();
        const disclosurePattern = /still under development|trained by google|large language model|i am a large language model|i'm a large language model|i am an ai language model|i'm an ai language model|cannot access external websites|can't access external websites|don't have the capability to access external websites|do not have the capability to access external websites|i am sorry, i am still under development|i'm sorry, i am still under development|including the one you provided|google\.|only as a language model/i;
        return disclosurePattern.test(value)
            ? 'I can help with that. I can analyze your profile, documents, goals, and market context, and I can use Research mode for live web findings when needed. Share the link, document, or specific details you want me to work with.'
            : value;
    }

    async function typeQuery() {
        const text = chatInput.value.trim();
        if (!text || !currentSessionId || requestInFlight) return;
        const fakeOpportunity = detectFakeOpportunity(text);
        if (fakeOpportunity) {
            removeLoadingMessage();
            appendAssistantReply(
                `⚠️ This looks like a fake job, fake contract, or fake business opportunity. Warning signs: ${fakeOpportunity.reasons.map(reason => `“${reason}”`).join(', ')}. Before you send any money, share your CV, or click a link, verify the company website, confirm the recruiter is real, and check whether the role is listed on the company’s official careers page.`
            );
            requestInFlight = false;
            document.getElementById('sendChatButton').disabled = false;
            return;
        }
        const urlInPrompt = extractUrlFromText(text);
        const webResearchRequested = shouldUseWebResearch(text);
        requestInFlight = true;
        document.getElementById('sendChatButton').disabled = true;

        appendMessage('user', text);
        saveMessage(currentSessionId, 'user', text);
        chatInput.value = '';
        chatInput.style.height = 'auto';

        if (isVideoAdvertRequest(text)) {
            appendVideoAdvertWorkspace(text);
            return;
        }

        appendLoadingMessage(webResearchRequested);

        updateHistorySidebar();

        const detectedLang = selectedChatLanguage === 'auto' ? detectLanguage(text) : selectedChatLanguage;
        window.lastChatLanguage = detectedLang;

        try {
            const agentReply = await runAgentCommand(
                webResearchRequested ? (urlInPrompt ? `/research ${urlInPrompt}` : `/research ${text}`) : text
            );
            if (agentReply) {
                removeLoadingMessage();
                appendAssistantReply(agentReply);
                return;
            }
            const response = await fetchWithRecovery('/api/v1/cerebras_proxy/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    contents: getSessionHistory(currentSessionId).map(m => ({
                        role: m.role === 'user' ? 'user' : 'assistant',
                        text: m.text
                    })),
                    preferred_api: 'cerebras',
                    language: detectedLang,
                    user_focus: selectedFocus,
                    assistant_mode: selectedMode
                })
            });

            if (!response.ok) {
                const browserReply = await tryBrowserAi(
                    getSessionHistory(currentSessionId),
                    detectedLang,
                    selectedFocus
                );
                removeLoadingMessage();
                appendAssistantReply(browserReply || 'I cannot reach the AI services right now. Here is a useful next step: define one clear goal for this week and write down the smallest action you can complete today.');
                return;
            }

            const data = await response.json();
            let reply = data.text || data.reply || data.response || data.choices?.[0]?.message?.content;
            if (data.model_used?.startsWith('Fallback Response')) {
                reply = await tryBrowserAi(
                    getSessionHistory(currentSessionId),
                    detectedLang,
                    selectedFocus
                ) || reply;
            }
            
            removeLoadingMessage();
            
            if (reply) {
                window.lastChatLanguage = detectedLang;
                // Check if user asked for PDF export
                if (text.toLowerCase().includes('export as resume') || text.toLowerCase().includes('download resume')) {
                    exportToPDF(reply, 'resume');
                    appendMessage('ai', 'Your Resume PDF is being generated and will download shortly.');
                } else if (text.toLowerCase().includes('export as plan') || text.toLowerCase().includes('download plan')) {
                    exportToPDF(reply, 'business_plan');
                    appendMessage('ai', 'Your Business Plan PDF is being generated and will download shortly.');
                } else if (text.toLowerCase().includes('resume') || text.toLowerCase().includes('cv') || text.toLowerCase().includes('export')) {
                    appendAssistantReply(reply);
                    appendMessage('ai', '**Would you like me to export this as a PDF Resume?** Say "export as resume" and I\'ll generate it for you.');
                } else if (text.toLowerCase().includes('business plan') || text.toLowerCase().includes('plan') || text.toLowerCase().includes('startup')) {
                    appendAssistantReply(reply);
                    appendMessage('ai', '**Would you like me to export this as a Business Plan PDF?** Say "export as plan" and I\'ll create it.');
                } else {
                    appendAssistantReply(reply);
                }
            } else {
                const browserReply = await tryBrowserAi(
                    getSessionHistory(currentSessionId),
                    detectedLang,
                    selectedFocus
                );
                appendAssistantReply(browserReply || 'I cannot reach the AI services right now. Here is a useful next step: define one clear goal for this week and write down the smallest action you can complete today.');
            }
        } catch(err) {
            console.error(err);
            removeLoadingMessage();
            const browserReply = await tryBrowserAi(
                getSessionHistory(currentSessionId),
                detectedLang,
                selectedFocus
            );
            appendAssistantReply(browserReply || 'I cannot reach the AI services right now. Here is a useful next step: define one clear goal for this week and write down the smallest action you can complete today.');
        } finally {
            requestInFlight = false;
            document.getElementById('sendChatButton').disabled = false;
        }
    }

    function exportToPDF(content, docType) {
        fetch('/api/v1/generate_document_pdf/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ text: content, doc_type: docType })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success && data.redirect_url) {
                window.open(data.redirect_url + '?download=1', '_blank');
            }
        })
        .catch(err => console.error(err));
    }

    function updateHistorySidebar() {
        const sessions = getChatSessions();
        const container = document.getElementById('historyList');
        container.innerHTML = '';
        
        Object.keys(sessions).reverse().forEach(id => {
            const item = document.createElement('div');
            item.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
            
            const userMsgs = sessions[id].filter(m => m.role === 'user');
            item.innerText = userMsgs.length > 0 ? userMsgs[0].text.substring(0, 30) + '...' : "New Chat";
            
            item.onclick = () => {
                switchSession(id);
                if(sidebarMenu.classList.contains('open')) {
                    toggleMobileMenu();
                }
            };
            container.appendChild(item);
        });
    }

    function switchSession(id) {
        currentSessionId = id;
        localStorage.setItem('lastSessionId', id);
        chatLog.innerHTML = '';
        
        const history = getSessionHistory(id);
        if (history.length === 0) {
            appendWelcome();
            appendMessage('ai', WELCOME_MESSAGE);
            saveMessage(id, 'ai', WELCOME_MESSAGE);
        } else {
            history.forEach(m => appendMessage(m.role, m.text));
        }
        updateHistorySidebar();
        scrollToBottom();
    }

    function createNewChat() {
        const newSessionId = 'sess_' + Date.now();
        switchSession(newSessionId);
    }

    function clearChat() {
        if(confirm("Are you sure you want to erase all chat history? This cannot be undone.")) {
            localStorage.removeItem('chat_sessions');
            localStorage.removeItem('lastSessionId');
            createNewChat();
        }
    }

    chatInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    chatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            typeQuery();
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const lastSession = localStorage.getItem('lastSessionId');
        const sessions = getChatSessions();
        
        if (lastSession && sessions[lastSession]) {
            switchSession(lastSession);
        } else {
            createNewChat();
        }
    });
</script>
